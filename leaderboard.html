<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Classement Clash Royale Ranked / Path of Legend mondial et par pays.">
  <title>EvANLUX • Leaderboard Ranked</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="topnav">
    <div class="topnav__brand">⚡ EVAN<span>LUX</span></div>
    <div class="topnav__links">
      <a href="index.html">Accueil</a>
      <a href="recompenses.html">Récompenses</a>
      <a href="deck-meta.html">Deck Meta</a>
      <a href="tracker.html">Tracker</a>
      <a href="leaderboard.html" class="active">Leaderboard</a>
    </div>
  </nav>

  <main>
    <section class="section">
      <div class="section__eyebrow">🏆 LEADERBOARD</div>
      <h2>Classement Ranked / Path of Legend.</h2>
      <p class="lead">Consulte les meilleurs joueurs du classement Ranked actuel, mondialement ou par pays.</p>

      <div class="leaderboard-controls">
        <label for="region-select">Région :</label>
        <select id="region-select">
          <option value="global">🌍 Mondial</option>
          <option value="57000087">🇫🇷 France</option>
          <option value="57000029">🇧🇪 Belgique</option>
          <option value="57000047">🇨🇦 Canada</option>
        </select>

        <label for="limit-select">Joueurs :</label>
        <select id="limit-select">
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="200" selected>200</option>
          <option value="500">500</option>
        </select>

        <button id="refresh-btn" class="btn btn--secondary">🔄 Actualiser</button>
      </div>

      <div id="state" class="state-msg">Chargement du classement...</div>

      <div class="table-scroll">
        <table class="leaderboard-table" id="leaderboard-table" style="display:none">
          <thead id="leaderboard-head"></thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p>⚡ EVANLUX • Contenu Clash Royale non officiel, non affilié à Supercell.</p>
  </footer>

  <script src="config.js?v=8"></script>
  <script src="leaderboard.js?v=8"></script>
</body>
</html>
